<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>JPods — FollowMe Inspector</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1e1e1e; color: #d4d4d4;
      display: flex; flex-direction: column; height: 100vh; overflow: hidden;
      font-size: 12px;
    }
    #header {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 14px; background: #252526;
      border-bottom: 1px solid #3c3c3c; flex-shrink: 0;
    }
    #header h1 { font-size: 13px; font-weight: 600; color: #9cdcfe; flex: 1; }
    #status { font-size: 11px; color: #888; }
    #toolbar {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px; background: #252526;
      border-bottom: 1px solid #3c3c3c; flex-shrink: 0;
    }
    #filter {
      background: #3c3c3c; border: 1px solid #555; border-radius: 3px;
      color: #d4d4d4; padding: 4px 8px; font-size: 12px; width: 220px;
    }
    #filter::placeholder { color: #666; }
    .btn {
      border: 1px solid #4d4d4d; border-radius: 3px;
      padding: 3px 10px; font-size: 11px; font-weight: 600;
      cursor: pointer; background: #2d2d2d; color: #d4d4d4;
    }
    .btn:hover { border-color: #7a7a7a; color: #fff; }
    .btn.primary { background: #0e639c; color: #fff; border-color: #1f7bbb; }
    #legend {
      display: flex; gap: 14px; align-items: center;
      padding: 4px 14px; background: #1e1e1e;
      border-bottom: 1px solid #3c3c3c; flex-shrink: 0; flex-wrap: wrap;
    }
    .leg { display: flex; align-items: center; gap: 4px; font-size: 10px; color: #888; }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
    }
    .dot.origin    { background: #4ec98c; }
    .dot.terminal  { background: #e05252; }
    .dot.diverging { background: #e5c94a; }
    .dot.merging   { background: #c586c0; }
    .dot.continuing{ background: #4fc1ff; }

    #table-wrap { flex: 1; overflow-y: auto; }
    table { width: 100%; border-collapse: collapse; }
    thead tr {
      position: sticky; top: 0; background: #2d2d2d;
      border-bottom: 2px solid #3c3c3c; z-index: 10;
    }
    th {
      padding: 6px 10px; text-align: left;
      font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.07em; color: #888; font-weight: 600;
      white-space: nowrap; user-select: none;
    }
    tbody tr { border-bottom: 1px solid #2a2a2a; }
    tbody tr:hover { background: #252526; }
    tbody tr.selected { background: #1a3a5c !important; }
    td { padding: 5px 10px; vertical-align: middle; }
    .line-id { font-family: monospace; font-size: 11px; color: #9cdcfe; }
    .track-badge {
      display: inline-block; border-radius: 3px; padding: 1px 5px;
      font-size: 10px; font-weight: 600; font-family: monospace;
    }
    .track-0 { background: #1a3a5c; color: #4fc1ff; }
    .track-1 { background: #3a1a1a; color: #f44747; }
    .len { font-family: monospace; font-size: 11px; color: #b5cea8; }
    .conn-cell { font-size: 10px; line-height: 1.5; }
    .conn-line { font-family: monospace; color: #ccc; }
    .beh {
      display: inline-block; border-radius: 10px;
      padding: 1px 6px; font-size: 9px; font-weight: 700;
      letter-spacing: 0.04em; margin-bottom: 2px;
    }
    .beh.origin    { background: #1b4a2e; color: #4ec98c; }
    .beh.terminal  { background: #4a1b1b; color: #e05252; }
    .beh.diverging { background: #4a3b00; color: #e5c94a; }
    .beh.merging   { background: #3a1a4a; color: #c586c0; }
    .beh.continuing{ background: #1a2a3a; color: #4fc1ff; }
    .highlight-btn {
      border: 1px solid #4d4d4d; border-radius: 3px;
      padding: 3px 8px; font-size: 10px; font-weight: 600;
      cursor: pointer; background: #2d2d2d; color: #d4d4d4;
      white-space: nowrap;
    }
    .highlight-btn:hover { background: #0e639c; color: #fff; border-color: #1f7bbb; }
    .highlight-btn.active { background: #1a6b2e; color: #fff; border-color: #2f8f45; }
    #empty {
      padding: 40px; text-align: center; color: #555; font-size: 13px;
    }
  </style>
</head>
<body>

<div id="header">
  <h1>FollowMe Line Inspector</h1>
  <span id="status">Loading…</span>
</div>

<div id="toolbar">
  <input id="filter" type="text" placeholder="Filter by line ID or structure…">
  <button class="btn primary" onclick="refreshData()">Refresh</button>
  <button class="btn" onclick="clearHighlight()">Clear Highlight</button>
</div>

<div id="legend">
  <div class="leg"><div class="dot origin"></div>Origin (no inbound)</div>
  <div class="leg"><div class="dot terminal"></div>Terminal (no outbound)</div>
  <div class="leg"><div class="dot diverging"></div>Diverging (split)</div>
  <div class="leg"><div class="dot merging"></div>Merging (join)</div>
  <div class="leg"><div class="dot continuing"></div>Continuing</div>
</div>

<div id="table-wrap">
  <div id="empty" style="display:none">No lines match the filter.</div>
  <table id="tbl">
    <thead>
      <tr>
        <th>Line ID</th>
        <th>Track</th>
        <th>Length</th>
        <th>Start (inbound)</th>
        <th>End (outbound)</th>
        <th></th>
      </tr>
    </thead>
    <tbody id="tbody"></tbody>
  </table>
</div>

<script>
  var allLines = [];
  var selectedId = null;

  function refreshData() {
    document.getElementById('status').textContent = 'Loading…';
    sketchup.cmd_load_lines();
  }

  function initLines(lines) {
    allLines = lines || [];
    document.getElementById('status').textContent =
      allLines.length + ' line' + (allLines.length === 1 ? '' : 's');
    renderTable(document.getElementById('filter').value.trim().toLowerCase());
  }

  function renderTable(filterText) {
    var tbody = document.getElementById('tbody');
    tbody.innerHTML = '';
    var filtered = filterText
      ? allLines.filter(function(l) {
          return l.id.toLowerCase().includes(filterText) ||
                 (l.connection_id || '').toLowerCase().includes(filterText);
        })
      : allLines;

    document.getElementById('empty').style.display = filtered.length === 0 ? '' : 'none';
    document.getElementById('tbl').style.display   = filtered.length === 0 ? 'none' : '';

    filtered.forEach(function(line) {
      var conns = line.connections || {};
      var startC = conns.start || {};
      var endC   = conns.end   || {};
      var startBeh = startC.behavior || '';
      var endBeh   = endC.behavior   || '';
      var startLines = (startC.lines || []).map(function(l) { return l.id; });
      var endLines   = (endC.lines   || []).map(function(l) { return l.id; });

      var tr = document.createElement('tr');
      if (line.id === selectedId) tr.classList.add('selected');

      tr.innerHTML =
        '<td class="line-id">' + esc(line.id) + '</td>' +
        '<td><span class="track-badge track-' + line.track_index + '">' +
          (line.track_index === 0 ? 'FWD 0' : 'REV 1') + '</span></td>' +
        '<td class="len">' + fmtLen(line.length_mm) + '</td>' +
        '<td class="conn-cell">' +
          '<span class="beh ' + startBeh + '">' + startBeh.toUpperCase() + '</span><br>' +
          startLines.map(function(l){ return '<span class="conn-line">' + esc(l) + '</span>'; }).join('<br>') +
        '</td>' +
        '<td class="conn-cell">' +
          '<span class="beh ' + endBeh + '">' + endBeh.toUpperCase() + '</span><br>' +
          endLines.map(function(l){ return '<span class="conn-line">' + esc(l) + '</span>'; }).join('<br>') +
        '</td>' +
        '<td><button class="highlight-btn' + (line.id === selectedId ? ' active' : '') +
          '" onclick="highlightLine(' + JSON.stringify(line.id) + ')">Select</button></td>';

      tbody.appendChild(tr);
    });
  }

  function highlightLine(lineId) {
    selectedId = lineId;
    renderTable(document.getElementById('filter').value.trim().toLowerCase());
    sketchup.cmd_highlight(lineId);
  }

  function clearHighlight() {
    selectedId = null;
    renderTable(document.getElementById('filter').value.trim().toLowerCase());
    sketchup.cmd_clear_highlight();
  }

  function fmtLen(mm) {
    if (mm == null) return '—';
    if (mm >= 1000) return (mm / 1000).toFixed(1) + ' m';
    return mm.toFixed(0) + ' mm';
  }

  function esc(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  document.getElementById('filter').addEventListener('input', function() {
    renderTable(this.value.trim().toLowerCase());
  });

  // Auto-load on ready
  window.addEventListener('load', function() { refreshData(); });
</script>
</body>
</html>
